[package]
name = "playlist"
version = "0.1.0"
description = "A cross-platform music playlist manager"
authors = ["sha5b"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# Tauri
tauri = { version = "2.10.3", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

# Database
rusqlite = { version = "0.35", features = ["bundled"] }

# Audio metadata
lofty = "0.23"

# Audio playback
rodio = { version = "0.20", features = ["symphonia-all"] }
rand = "0.8"

# Async
crossbeam-channel = "0.5"
walkdir = "2"

# HTTP / Downloads
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
zip = "2"

# Platform: thread priority for audio
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
