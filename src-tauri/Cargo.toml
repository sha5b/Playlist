[package]
name = "playlist"
version = "0.3.1"
description = "Liberate your music from streaming platforms. Own your data, build your library, support artists directly."
authors = ["sha5b"]
license = "MIT"
repository = "https://github.com/sha5b/Playlist"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# Tauri
tauri = { version = "2.10.3", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-single-instance = "2.4.0"

# Database
rusqlite = { version = "0.35", features = ["bundled"] }

# Audio metadata
lofty = "0.23"

# Audio playback
rodio = { version = "0.20", features = ["symphonia-all"] }
cpal = "0.15"
rand = "0.8"

# Async
crossbeam-channel = "0.5"
walkdir = "2"

# HTTP / Downloads
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "cookies"] }
futures-util = "0.3"
zip = "2"

# Async traits
async-trait = "0.1"

# Crypto (Deezer Blowfish decryption)
blowfish = "0.9"
cbc = "0.1"
md-5 = "0.10"
aes = "0.8"
hex = "0.4"

# Spotify (librespot) — DISABLED: Spotify deprecated password auth (forced OAuth2 mid-2025).
# Uncomment these if OAuth support is added in the future.
# librespot-core = { git = "https://github.com/librespot-org/librespot", branch = "dev" }
# librespot-audio = { git = "https://github.com/librespot-org/librespot", branch = "dev" }
# librespot-metadata = { git = "https://github.com/librespot-org/librespot", branch = "dev" }

# Platform: thread priority for audio
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
